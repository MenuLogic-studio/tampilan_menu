<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>

<body class="bg-gray-50 text-gray-800">

<!-- WRAPPER -->
<div class="md:flex">

  <!-- SIDEBAR (DESKTOP ONLY) -->
  <aside class="hidden md:block w-64 bg-white h-screen p-5 shadow">
    <h1 class="font-bold text-lg mb-6">Menu</h1>
    <nav class="space-y-4 text-gray-600">
      <div>🏠 Beranda</div>
      <div>🔥 Populer</div>
      <div>👤 Profil</div>
    </nav>
  </aside>

  <!-- MAIN -->
  <div class="flex-1 pb-20">

    <!-- HEADER -->
    <header class="fixed md:static top-0 w-full bg-white shadow p-3 flex justify-between z-50">
      <h1 class="font-bold">Menu</h1>
      <span>❤️</span>
    </header>

    <main class="pt-16 md:pt-6 px-4 max-w-5xl mx-auto">

      <!-- STORE -->
      <section class="bg-white p-4 rounded-xl shadow flex gap-3 items-center">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEDfPG2FsrlTllWl1u_0xbntjT6fX9RbjFifjDvOkcDWUPqpTuqWckrO8dmuV1CMK5wUKuQwhVqNk-hc_SccdgMPUnVgBQCgLuXNxNUM_U4h8BFVSuZsm_xnNi0taA7fV71hUAfNBrOh9cKV02RaI9sO6Jrdvq2PY9NkLjGmwW186QhBKLKA0znQB6kalkg_3SqVGKfYCBtXnHhogf0Yd5y5FOPx3MwuB_DmXuYFNUfqDwhSMJTakLCxjGY15kFG5J5O0EwLSNukg"
             class="w-16 h-16 rounded-lg object-cover">
        <div>
          <h2 class="font-bold">Kantin Sejahtera</h2>
          <p class="text-sm text-gray-500">⭐ 4.8 (120+)</p>
        </div>
      </section>

      <!-- MENU -->
      <section class="mt-4 grid md:grid-cols-2 gap-4">

        <!-- ITEM -->
        <div class="bg-white p-3 rounded-xl shadow">

          <!-- MOBILE -->
          <div class="flex items-center gap-3 md:hidden">
            <img src="https://media.istockphoto.com/id/1458421012/id/foto/nasi-ayam-geprek-sambal-bawang.jpg"
                 class="w-14 h-14 object-cover rounded-lg">

            <div class="flex-1">
              <h3 class="font-semibold text-sm">Ayam Geprek</h3>
              <p class="text-red-500 font-bold text-sm">Rp8.000</p>
            </div>

            <button class="bg-red-100 text-red-600 w-10 h-10 rounded-lg flex items-center justify-center">
              🛒
            </button>
          </div>

          <!-- DESKTOP -->
          <div class="hidden md:block">
            <img src="https://resepmamiku.com/wp-content/uploads/2022/02/ayam-geprek-yscooking-760x950.jpg"
                 class="w-full h-40 object-cover rounded-lg">

            <h3 class="mt-2 font-semibold">Ayam Geprek</h3>

            <div class="flex justify-between mt-2">
              <span class="text-red-500 font-bold">Rp8.000</span>
              <button class="bg-red-100 px-3 py-1 rounded">+</button>
            </div>
          </div>
        </div>

        <!-- ITEM -->
        <div class="bg-white p-3 rounded-xl shadow">

          <!-- MOBILE -->
          <div class="flex items-center gap-3 md:hidden">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXW_75o4NSTjgOoycSXLOW0SF-UCDgDpqmHdyoQoQ4CW-MFU35K4N2es7nb4GX3WS511DBAE-Een9rStQDdZrm60yNwj2OzTjQ8VhHNWOA-pUya8y4ElszNS1W32DfZ5ig9xgHStB4I2yzHWm-3Se57RFSv3BV0LfFthBX-93jlbf_yjIuA_U3f5JGcnmNUt0lCYMHEx9GIOqjij6LOQAmE98WJOoqhK9UbbLuPM3Icwdh1HOCcXkdlOVZIaLtOqfz9SkHWxvY_Kc"
                 class="w-14 h-14 object-cover rounded-lg">

            <div class="flex-1">
              <h3 class="font-semibold text-sm">Burger</h3>
              <p class="text-red-500 font-bold text-sm">Rp7.000</p>
            </div>

            <button class="bg-red-100 text-red-600 w-10 h-10 rounded-lg flex items-center justify-center">
              🛒
            </button>
          </div>

          <!-- DESKTOP -->
          <div class="hidden md:block">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXW_75o4NSTjgOoycSXLOW0SF-UCDgDpqmHdyoQoQ4CW-MFU35K4N2es7nb4GX3WS511DBAE-Een9rStQDdZrm60yNwj2OzTjQ8VhHNWOA-pUya8y4ElszNS1W32DfZ5ig9xgHStB4I2yzHWm-3Se57RFSv3BV0LfFthBX-93jlbf_yjIuA_U3f5JGcnmNUt0lCYMHEx9GIOqjij6LOQAmE98WJOoqhK9m"
                 class="w-full h-40 object-cover rounded-lg">

            <h3 class="mt-2 font-semibold">Burger</h3>

            <div class="flex justify-between mt-2">
              <span class="text-red-500 font-bold">Rp7.000</span>
              <button class="bg-red-100 px-3 py-1 rounded">+</button>
            </div>
          </div>
        </div>

      </section>

      <!-- REVIEW -->
      <section class="mt-6">
        <h2 class="font-bold mb-2">Review</h2>
        <div class="flex gap-3 overflow-x-auto">
          <div class="bg-white p-3 rounded-xl shadow w-60">
            <p class="text-sm italic">"Makanannya enak banget!"</p>
            <p class="text-yellow-500">⭐⭐⭐⭐⭐</p>
          </div>

          <div class="bg-white p-3 rounded-xl shadow w-60">
            <p class="text-sm italic">"Cepat dan murah!"</p>
            <p class="text-yellow-500">⭐⭐⭐⭐⭐</p>
          </div>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- NAVBAR MOBILE -->
<footer class="fixed bottom-0 w-full bg-white shadow flex justify-around py-2 md:hidden">
  <span>🏠</span>
  <span>🔥</span>
  <span>👤</span>
</footer>

</body>
</html>
