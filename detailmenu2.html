<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Menu</title>

<style>
    * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 10px;
    }

    .card {
        width: 100%;
        min-height: 100vh;
        max-width: 480px;
        margin: auto;
        background: white;
        border-radius: 0;
        padding: 16px;
      }
    
    @media (min-width: 600px){
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        min-height: auto;
        border-radius: 25px;
        max-width: 360px;
      }
    }  

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
      }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #FA8E3C;
        border: none;
        padding: 10px;
        border-radius: 12px;
    }

    .header h3 {
        margin: 0;
        font-size: 15px;
    }

    .heart {
        color: #EE3535;
        font-size: 18px;
        cursor: pointer;
        transition: 0.2s;
    }

    .heart:active {
        transform: scale(1.3);
    }

    .food-img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 15px;
        margin: 15px 0;
    }

    .title-price {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    .title {
        font-size: 17px;
        font-weight: bold;
    }

    .price {
        color: #EE3535;
        font-weight: bold;
    }

    .rating {
        color: #FBB13C;
        font-size: 13px;
        margin: 5px 0;
    }

    .section-title {
        font-weight: bold;
        margin-top: 12px;
        font-size: 13px;
    }

    .ingredients {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap; /* 🔥 biar turun kalau sempit */
    }

    .ingredient {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .i1 { background: #f3e5f5; }
    .i2 { background: #e3f2fd; }
    .i3 { background: #fff3e0; }
    .i4 { background: #ffebee; }

    .description {
        font-size: 12.5px;
        color: #666;
        margin-top: 6px;
        line-height: 1.4;
    }

    .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 18px;
        gap: 10px;
    }

    .qty {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #f1f1f1;
        padding: 5px 10px;
        border-radius: 10px;
    }

    .btn {
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 6px;
        background: #EE3535;
        color: white;
        cursor: pointer;
        font-size: 15px;
    }

    .cart-btn {
        background: #EE3535;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 12px;
        cursor: pointer;
        flex: 1;
    }

    @media (max-width: 400px) {
        .card {
            padding: 14px;
        }

        .bottom {
            flex-direction: column;
            align-items: stretch;
        }

        .cart-btn {
            width: 100%;
        }
    }

    /* 🔥 EXTRA: layar gede biar gak terlalu kecil */
    @media (min-width: 768px) {
        .card {
            max-width: 400px;
        }
    }
</style>
</head>

<body>

<div class="card">

    <div class="header">
        <span>←</span>
        <h3>Detail Menu</h3>
        <span class="heart">❤</span>
    </div>

    <img src="https://media.istockphoto.com/id/2148672887/id/foto/burger-patty-daging-sapi-dengan-sayuran-dan-selada-dengan-latar-belakang-putih-file-berisi.jpg?s=612x612&w=0&k=20&c=PvX-ieuNxdwloMSicBs_voDWg0s6JumtOlZf2Al6TnA=" class="food-img">

    <div class="title-price">
        <div class="title">Burger</div>
        <div class="price">Rp7.000</div>
    </div>

    <div class="rating">★★★★★</div>

    <div class="section-title">Bahan-bahan</div>

    <div class="ingredients">
        <div class="ingredient i1">🧀</div>
        <div class="ingredient i2">🍗</div>
        <div class="ingredient i3">🧅</div>
        <div class="ingredient i4">🍅</div>
    </div>

    <div class="section-title">Deskripsi</div>
    <div class="description">
        Burger daging sapi ini menggunakan 100% daging sapi berkualitas dengan sayuran segar.
    </div>

    <div class="bottom">
        <div class="qty">
            <button class="btn" onclick="kurang()">-</button>
            <span id="jumlah">1</span>
            <button class="btn" onclick="tambah()">+</button>
        </div>

        <button class="cart-btn" onclick="keranjang()">Masukkan Keranjang</button>
    </div>

</div>

<script>
let jumlah = 1;

function tambah() {
    jumlah++;
    document.getElementById("jumlah").innerText = jumlah;
}

function kurang() {
    if (jumlah > 1) {
        jumlah--;
        document.getElementById("jumlah").innerText = jumlah;
    }
}

function keranjang() {
    alert("Ditambahkan ke keranjang: " + jumlah + " item");
}
</script>

</body>
</html>
